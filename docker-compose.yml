services:
  media-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media_practice_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Produção: autenticação obrigatória, demo/seed desligados e chave JWT
      # obrigatória. Sem `ENVIRONMENT=production` a aplicação subiria em modo
      # desenvolvimento (rotas abertas, login demo e seed automático).
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://media_user:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/media_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env (openssl rand -hex 32)}
      # Cifra de CPF/CNS em repouso (AES-256-GCM). Obrigatória aqui para que a
      # chave NÃO seja derivada do JWT e possa ser rotacionada/guardada com o
      # backup — perder esta chave torna os documentos ilegíveis.
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?defina FIELD_ENCRYPTION_KEY no .env (openssl rand -hex 32)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - AUTO_SEED_DEMO_DATA=false
      - DEMO_LOGIN_ENABLED=false
      - SSO_ENABLED=false
      # O entrypoint da imagem roda `alembic upgrade head` antes do Uvicorn.
      - AUTO_MIGRATE_ON_STARTUP=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: media_practice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: media_db
    # Porta 5432 exposta apenas em loopback para evitar acesso externo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TURN auto-hospedado para sinalização WebRTC atrás de NAT simétrico.
  # Habilitar com: TURN_SECRET=<segredo> docker compose --profile turn up -d
  # Requer liberar no firewall: 3478/udp+tcp e faixa 49152-65535/udp
  coturn:
    image: coturn/coturn:4.6
    container_name: media_practice_coturn
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-media-turn-secret-trocar}"
      - "--realm=media.local"
      - "--min-port=49152"
      - "--max-port=65535"

volumes:
  postgres_data: