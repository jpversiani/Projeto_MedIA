version: '3.8'

services:
  esus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esus_pec_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://esus_user:esus_pass@db:5432/esus_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: esus_postgres_db
    restart: always
    environment:
      POSTGRES_USER: esus_user
      POSTGRES_PASSWORD: esus_pass
      POSTGRES_DB: esus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
