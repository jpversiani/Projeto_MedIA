[pytest]
pythonpath = backend
testpaths = backend/tests
addopts = -q

# Testes assíncronos (cliente SISAB, WebSocket de telemedicina).
# Sem estas opções o pytest-asyncio ignora `@pytest.mark.asyncio` e os
# testes são reportados como "async def functions are not natively supported".
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: marca testes assíncronos executados pelo pytest-asyncio.

# Ignora artefatos temporários que não são testes.
# `media_env_*`: pastas vazias criadas por uma versão anterior de
# `test_seguranca_v1.py` via `tempfile.mkdtemp`. No Windows elas ficaram com
# permissões que impedem até a remoção dentro do ambiente de execução — e o
# pytest tentava importá-las como módulos de teste, quebrando a coleta.
# Resíduo vazio: podem ser apagadas manualmente a qualquer momento.
norecursedirs = media_env_* .git .venv .uvcache __pycache__ *.egg-info
