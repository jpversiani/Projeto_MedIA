name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Auditoria semanal, mesmo sem commits novos.
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analise:
    name: Análise de segurança (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Autenticar no CodeQL
        uses: github/codeql-action/authenticate@v3

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
