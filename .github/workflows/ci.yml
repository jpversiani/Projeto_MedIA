name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções obsoletas quando um novo commit chega no mesmo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Verificar que a importação da aplicação não quebra
        run: |
          cd backend
          python -c "import app.main; print('app.main importado com sucesso')"

      - name: Rodar a suíte
        run: pytest -q --cov=backend/app --cov-report=xml --cov-report=term:skip-covered

      - name: Verificar que a migração inicial constrói o schema completo
        # A migração do Alembic foi o mecanismo real de criação de schema.
        # Este passo falha se ela deixar de criar as tabelas.
        run: |
          cd backend
          alembic -c ../alembic.ini upgrade head
          python - <<'PY'
          import os, sqlite3, tempfile
          db = os.path.join(tempfile.mkdtemp(), "schema_check.db")
          os.environ["DATABASE_URL"] = f"sqlite:///{db}"
          os.environ["AUTO_MIGRATE_ON_STARTUP"] = "false"
          os.environ["AUTO_SEED_DEMO_DATA"] = "false"
          from app.core.bootstrap import run_migrations
          run_migrations()
          con = sqlite3.connect(db)
          tabelas = [r[0] for r in con.execute(
              "select name from sqlite_master where type='table'")]
          print(f"{len(tabelas)} tabelas criadas")
          for esperada in ("usuarios", "cidadaos", "atendimentos_soap",
                           "audit_trail", "teleconsultas", "receitas", "guias_tiss"):
              assert esperada in tabelas, f"tabela ausente: {esperada}"
          print("schema completo")
          PY
